[project]
name = "bank-faqs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vu Truong Anh", email = "vu.wspace@gmail.com" }
]
requires-python = ">=3.12.15"
dependencies = [
    "chromadb>=1.5.9",
    "colorama>=0.4.6",
    "fastembed>=0.9.0",
    "google-generativeai>=0.8.6",
    "google-search-results>=2.4.2",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langchain-qdrant>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "langgraph-cli[inmem]>=0.4.8",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "pyvi>=0.1.1",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "tavily-python>=0.8.5",
    "truststore>=0.10.5",
]

[project.scripts]
bank-faqs = "bank_faqs:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
]
